<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Reset your NEXORA ERP account password"
    >

    <link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/login.css">
    <title>Forgot Password | NEXORA ERP</title>
</head>

<body>

    <!-- =========================================
         FORGOT PASSWORD PAGE
    ========================================== -->

    <main>

        <!-- Forgot Password Container -->
        <section>

            <!-- Brand -->
            <header>

                <h1>NEXORA ERP</h1>

                <p>
                    Smart Business Management
                </p>

            </header>


            <!-- Page Heading -->
            <div>

                <h2>Forgot Your Password?</h2>

                <p>
                    Don't worry. Enter your registered email
                    address and we'll help you reset your password.
                </p>

            </div>


            <!-- Forgot Password Form -->
            <form id="forgotPasswordForm">

                <!-- Email -->
                <div>

                    <label for="forgotEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="forgotEmail"
                        name="email"
                        placeholder="Enter your registered email"
                        autocomplete="email"
                        required
                    >

                    <small
                        id="forgotEmailError"
                        role="alert"
                    ></small>

                </div>


                <!-- Message -->
                <div
                    id="forgotPasswordMessage"
                    role="alert"
                    aria-live="polite"
                ></div>


                <!-- Submit Button -->
                <button
                    type="submit"
                    id="forgotPasswordButton"
                >
                    Send Reset Link
                </button>

            </form>


            <!-- Back to Login -->
            <footer>

                <p>
                    Remember your password?

                    <a href="login.html">
                        Back to Login
                    </a>
                </p>

            </footer>

        </section>

    </main>


    <!-- =========================================
         JAVASCRIPT WILL BE ADDED LATER
    ========================================== -->

</body>
</html>
